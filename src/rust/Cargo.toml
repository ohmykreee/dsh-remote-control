[package]
name = "dsh-probe"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Native OS probe sidecar for the DSH LAN console (media, volume, performance)"
publish = false

[[bin]]
name = "dsh-probe"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
plist = "1.10"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Geolocation",
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[features]
# Compile the macOS modules on any host so their syntax and types can be
# checked without a Mac. This does not make them tested; see README.
macos-check = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# libsqlite3-sys builds the bundled SQLite C source. MSVC's `/Z7` can fail with
# C compiler error D8050 on some Build Tools installations; the crate itself does
# not need debug info for our tests.
[profile.dev.package.libsqlite3-sys]
debug = false
