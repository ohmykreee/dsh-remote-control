# npm release for @ohmykreee/dsh-remote-control.
#
# Trigger: push a version tag (for example `git tag v1.0.3 && git push origin
# v1.0.3`). A manual run only rehearses the release unless the dry-run toggle is
# cleared, so a mis-click cannot publish.
#
# The gate is checks.yml itself, reused through `workflow_call`: the release
# reuses the exact job that branch pushes run, so a tag can never skip the
# TypeScript, Svelte or Rust checks.
#
# Only the Host half (src/dsh -> index.js + lib/) and the phone console
# (src/svelte -> web/) are rebuilt here. The Rust probe is a per-platform
# binary: it stays out of the tarball, and consumers who need media, volume,
# notifications, GPU/thermal or system location build it from the published
# sources themselves (INSTALLATION.md).
#
# Authentication is npm Trusted Publishing (OIDC), not a token: this workflow
# stores no credential and reads no secret. The `id-token: write` permission
# lets npm exchange the job's short-lived GitHub identity for a one-time
# publish credential, and the attestation that comes with it is what customers
# verify on npmjs.com.
#
# One-time setup on npmjs.com -> the package -> Settings -> Trusted publishing:
#   Provider           GitHub Actions
#   Organization/user  ohmykreee
#   Repository         dsh-remote-control
#   Workflow filename  publish-npm.yml   (the file name only)
#   Environment        npm               (matches the job environment below)
#
# npm only accepts a trusted publisher for a package that already exists, so the
# very first release has to create the package record once; AGENTS.md documents
# that bootstrap. A fresh configuration must also complete its first successful
# publish within 48 hours, so add it when a release is ready.
#
# Other npm policy this job follows:
#   - the package is scoped, so it publishes with `access: public` from
#     publishConfig instead of a flag-only override;
#   - `publishConfig.registry` pins the official registry, so a mirror can never
#     receive a release by accident;
#   - the `repository` field matches this GitHub repository, which provenance
#     validation requires;
#   - trusted publishing needs npm CLI 11.5.1+ on a GitHub-hosted runner, which
#     the guard step below checks before anything is built.
name: Publish npm

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify the tarball without uploading it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    # Same reusable gate as a branch push. Nothing publishes unless it passes.
    uses: ./.github/workflows/checks.yml

  publish:
    name: publish ${{ github.ref_name }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The trusted publisher is registered against this environment name, and
    # protection rules on the environment (required reviewers, deployment tags)
    # also gate the release.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ohmykreee/dsh-remote-control
    permissions:
      contents: read
      # The OIDC identity npm exchanges for a short-lived publish credential.
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Exact version, matching local development and checks.yml. Its
          # bundled npm is 11.x, new enough for trusted publishing.
          node-version: 26.7.0
          # Reuse the pnpm store across runs; the key follows pnpm-lock.yaml.
          cache: pnpm

      # Fail before the build when the environment cannot mint an OIDC token or
      # ships an npm too old for trusted publishing: both are configuration
      # problems that would otherwise surface at the very end of the release.
      - name: Check the npm client and OIDC
        run: |
          node --version
          npm --version
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC endpoint. The job needs 'permissions: id-token: write' for trusted publishing."
            exit 1
          fi
          current=$(npm --version)
          if [ "$(printf '%s\n%s\n' 11.5.1 "$current" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $current is too old for trusted publishing; npm 11.5.1 or newer is required."
            exit 1
          fi

      # No install scripts run here or for consumers: the package deliberately
      # declares none, because pnpm blocks dependency build scripts and DSH
      # reports that as a failed install that has to be approved and retried.
      - name: Install dependencies
        run: pnpm ci

      - name: Build the Host and the phone console
        run: |
          pnpm build:dsh
          pnpm build:web

      # Fails on a missing artifact, a private manifest, a declared install
      # script, a cordis.patch.yml / package name mismatch, a version drift
      # between package.json, the Host constant and the Rust crate, a tag that
      # does not match the version, and a tarball that omits or leaks files.
      - name: Verify the package
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/check-npm-package.mjs --tag "${GITHUB_REF_NAME}"
          else
            node scripts/check-npm-package.mjs
          fi

      - name: Resolve the dist-tag
        id: release
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            # Prereleases never take over `latest` from a released build.
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version $version -> dist-tag $tag"

      - name: Publish to npm
        env:
          # Manual runs default to a rehearsal; only a tag push always uploads.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          args=(--provenance --access public --tag "${{ steps.release.outputs.tag }}")
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: the tarball and the provenance rules are checked without uploading."
            args+=(--dry-run)
          fi
          npm publish "${args[@]}"
